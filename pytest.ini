[pytest]
testpaths = tests
# Parallel auf allen Kernen (pytest-xdist, `pip install -r requirements-dev.txt`); fehlt xdist, siehe conftest/AGENTS.md.
# `--dist load`: Tests einzeln verteilt (schnellster Lauf); teure Browser-Fixtures sind Session-Scope = je Worker einmal.
# Höchstens 8 Worker (RAM: jeder hält Demodaten/Stacks im Speicher).
# Seriell: `pytest -p no:xdist -o addopts=""`  ·  schneller Teilsatz ohne Browser: `pytest -m "not ui"`
addopts = -n auto --maxprocesses=8 --dist load
markers =
    ui: Oberflächentests im echten Browser (Playwright) – ausnehmen mit -m "not ui"
