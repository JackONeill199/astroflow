services:
  astroflow:
    build: .
    # Nur von diesem Rechner erreichbar. Heimnetz (Handy/Tablet): nicht einfach "8080:8080" – dann kämen je nach Docker-Variante
    # alle Anfragen von der Bridge-Adresse und AstroFlow könnte den eigenen Rechner nicht von anderen Geräten unterscheiden.
    # Stattdessen unter Linux: `ports` und ASTROFLOW_TRUSTED_NETS entfernen und `network_mode: host` setzen (Client-Adressen
    # bleiben echt, der Browser auf dem Rechner ist Loopback und kann unter Einstellungen → Heimnetz Geräte koppeln).
    ports:
      - "127.0.0.1:8080:8080"
    # network_mode: host
    volumes:
      - ./data:/data                  # Datenbank, Zwischenstände, Ergebnisse
      - /pfad/zu/deinen/fits:/data/input   # Eingangsordner (Rohaufnahmen) – anpassen!
    environment:
      ASTROFLOW_AUTO: "1"             # neue Aufnahmen automatisch verarbeiten
      # Anfragen über den veröffentlichten Port kommen im Container von der Docker-Bridge – wie „dieser Rechner“ behandeln.
      # Nur zusammen mit 127.0.0.1:… oben (dann erreicht nur dieser Rechner den Port); mit network_mode: host entfernen.
      ASTROFLOW_TRUSTED_NETS: "172.16.0.0/12,192.168.65.0/24"   # Docker-Bridge bzw. Docker Desktop
      ASTROFLOW_SCAN_INTERVAL: "60"
      # Optionaler KI-Bildprüfer (Vision-LLM):
      # ASTROFLOW_REVIEW_PROVIDER: lmstudio        # oder openrouter
      # ASTROFLOW_REVIEW_MODEL: qwen2.5-vl-7b-instruct
      # ASTROFLOW_REVIEW_URL: http://host.docker.internal:1234/v1
      # ASTROFLOW_REVIEW_KEY: sk-or-...            # nur OpenRouter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
