<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<meta name="description" content="AstroFlow – Astrofotografie, Spurenanalyse und Himmelsgeschichten in einer lokalen App">
<title>AstroFlow</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=2.0.25">
<link rel="stylesheet" href="sites.css?v=2.0.20">
<link rel="stylesheet" href="setup.css?v=2.0.25">
<link rel="stylesheet" href="look.css?v=2.0.18">
<script>try { const l = JSON.parse(localStorage.getItem('af.ui.look')) || 'dezent'; if (l !== 'schlicht') document.documentElement.dataset.look = l; } catch { document.documentElement.dataset.look = 'dezent'; }</script>
</head>
<body>
<div class="shell" id="shell">
  <header class="top">
    <a class="brand" href="#/"><img src="icon.svg" alt=""><span>AstroFlow</span></a>
    <button class="tbtn" id="sideToggle" title="Seitenleiste ein-/ausklappen" aria-label="Seitenleiste ein-/ausklappen"><svg><use href="#i-sidebar"/></svg></button>
    <div id="crumbs" class="crumbs"></div>
    <span class="grow"></span>
    <button class="search-btn" id="palBtn" title="Objekte und Befehle suchen (Strg+K)"><svg><use href="#i-search"/></svg><span>Suchen &amp; Befehle</span><kbd>Strg K</kbd></button>
    <a class="tbtn" id="importBtn" href="#/import" title="Dateien importieren"><svg><use href="#i-upload"/></svg><span>Importieren</span></a>
    <span class="top-sep"></span>
    <div class="jobs-ind"><button class="tbtn jobpill idle" id="jobpill" title="Laufende Aufträge" aria-haspopup="true" aria-expanded="false"><span class="job-symbol"><svg><use href="#i-pulse"/></svg></span><span class="t"></span><span class="count">0</span><i></i></button>
      <div class="popover" id="jobpop" role="dialog" aria-label="Laufende Aufträge"></div></div>
    <a class="tbtn" id="sysBtn" href="#/settings/module" title="System"><span class="sysdot" id="sysdot"></span></a>
    <button class="tbtn ctx-open-btn" id="ctxBtn" title="Details ein-/ausblenden" aria-label="Details ein-/ausblenden" hidden><svg><use href="#i-panel"/></svg></button>
  </header>
  <aside class="side">
    <nav id="nav" aria-label="Hauptnavigation"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="view" tabindex="-1"><nav class="subnav" id="subnav" aria-label="Bereich"></nav></main>
  <aside class="ctx" id="ctx" aria-label="Details" hidden><div class="ctx-h"><b id="ctxTitle"></b><button class="tbtn" id="ctxClose" title="Details schließen" aria-label="Details schließen"><svg><use href="#i-x"/></svg></button></div><div class="ctx-b" id="ctxBody"></div></aside>
  <div class="ctx-scrim" id="ctxScrim"></div>
</div>
<div id="drop" class="drop-overlay" hidden><div><svg><use href="#i-upload"/></svg><p>Dateien hier ablegen</p>
  <div class="dkinds"><div><b>FITS-Rohdaten</b>gehen in die Bilder-Pipeline</div><div><b>JPG · PNG · TIFF</b>kommen als fertige Bilder in die Galerie</div></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<dialog id="pal" aria-label="Befehlspalette"></dialog>
