# CodeQL-Sicherheitsanalyse für Python und JavaScript. Läuft erst, wenn das Repo öffentlich ist (für private Repos braucht
# Code Scanning „GitHub Advanced Security“). Nicht zusätzlich das „Default setup“ unter Settings → Code security einschalten –
# beides zusammen verträgt sich nicht. Ergebnisse: Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"          # montags, auch ohne Änderungen (neue Abfragen)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Fremdbibliotheken (three.js u. a.) und Testdaten nicht analysieren
          config: |
            paths-ignore:
              - "**/vendor/**"
              - "tests/**"

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
