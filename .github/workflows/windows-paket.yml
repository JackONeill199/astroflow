# Windows-Paket (portables ZIP + Installer) bauen und in sauberer Umgebung prüfen.
# Manuell startbar (Actions → „Windows-Paket“ → Run workflow), in PRs mit Änderungen am Paket; bei einem Versions-Tag v* zusätzlich als Release-Entwurf mit beiden Dateien.
name: Windows-Paket

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["installer/**", "pyproject.toml", "requirements.txt", "astroflow/core/launcher.py", "astroflow/core/setup.py", "astroflow/core/components.py", ".github/workflows/windows-paket.yml"]

permissions:
  contents: read          # Bauen und Prüfen (auch in PRs) nur lesend; Schreibrecht nur im Job „release“ bei Tags

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build-Werkzeuge
        run: python -m pip install --upgrade pip setuptools pillow

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Paket bauen
        run: python installer/build_windows.py --out dist

      - name: Prüfung in sauberer Umgebung (ohne Python im PATH, mit ASTAP-Download)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\AstroFlow-*-Windows-portabel.zip | Select-Object -First 1
          Expand-Archive $zip.FullName C:\Paket
          C:\Paket\AstroFlow\python\python.exe -I installer\pruefe_paket.py $zip.FullName --astap

      - name: Installer prüfen (still installieren, Start wie Startmenü, Demo, Beenden, Deinstallieren)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\AstroFlow-Setup-*.exe | Select-Object -First 1
          C:\Paket\AstroFlow\python\python.exe -I installer\pruefe_paket.py --setup $exe.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: astroflow-windows
          path: |
            dist/AstroFlow-*.zip
            dist/AstroFlow-Setup-*.exe
          retention-days: 14

  release:
    # Release-Entwurf nur bei Versions-Tags, als eigener Job mit Schreibrecht (der Bau-Job oben bleibt lesend)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: astroflow-windows
          path: dist

      - name: Release-Entwurf
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          python installer/release_notes.py $ver dist/notizen.md      # Abschnitt der Version aus CHANGELOG.md
          if ($LASTEXITCODE) { exit 1 }
          gh release create $env:GITHUB_REF_NAME --draft --title "AstroFlow $ver" --notes-file dist/notizen.md (Get-ChildItem dist\AstroFlow-*.zip, dist\AstroFlow-Setup-*.exe)
