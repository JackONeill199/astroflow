# Volle Testsuite (pytest, parallel wie lokal über pytest.ini) auf Ubuntu und Windows – Pflichtprüfung für PRs gegen main.
# Aufgeteilt in zwei parallele Jobs je Betriebssystem: „fast“ (alles außer Browser-Tests) und „ui“ (Playwright-Chromium, `-m ui`).
# Der Sammeljob `pytest (<os>)` hängt von beiden ab und behält den Namen der Pflichtprüfung (Branch-Protection bleibt unverändert). Was in der CI nicht geht (GPU/OpenCL, PyTorch-Engine, GraXpert unter Linux),
# überspringen die Tests selbst (importorskip/skipif) – siehe CONTRIBUTING.md.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Tests ohne Browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env: &env
      PYTHONUTF8: "1"
      ASTROFLOW_UPDATE_CHECK: "0"
      ASTROFLOW_NO_TRAY: "1"
      ASTROFLOW_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Leichte SkyTrace-Engine-Pakete (ohne PyTorch/Ultralytics), damit deren Tests laufen; Liste: modules/skytrace/requirements-engine.txt
          python -m pip install skyfield requests filelock opencv-python-headless photutils av

      - name: pytest (ohne Browser-Tests)
        run: python -m pytest -q -rsfE --timeout=300 --durations=15 -m "not ui" --junitxml=pytest-fast-${{ matrix.os }}.xml

      - name: Testprotokoll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-${{ matrix.os }}
          path: pytest-fast-${{ matrix.os }}.xml
          retention-days: 14

  ui:
    name: Browser-Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: ~/.cache/ms-playwright
          - os: windows-latest
            browsers: ~/AppData/Local/ms-playwright
    env: *env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install skyfield requests filelock opencv-python-headless photutils av

      - name: Playwright-Version
        id: pw
        shell: bash
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Chromium aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.browsers }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Chromium installieren
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Systempakete für Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium

      - name: pytest (nur Browser-Tests)
        run: python -m pytest -q -rsfE --timeout=300 --durations=15 -m ui --junitxml=pytest-ui-${{ matrix.os }}.xml

      - name: Testprotokoll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ui-${{ matrix.os }}
          path: pytest-ui-${{ matrix.os }}.xml
          retention-days: 14

  # Sammeljob: trägt den bisherigen Namen der Pflichtprüfungen („pytest (ubuntu-latest)“, „pytest (windows-latest)“)
  pytest:
    name: pytest (${{ matrix.os }})
    needs: [fast, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      actions: read
    steps:
      # Je Betriebssystem auswerten (nicht über die ganze Matrix), damit „pytest (ubuntu-latest)“ nur bei Ubuntu-Fehlern rot wird
      - name: Ergebnis der Teiljobs dieses Betriebssystems prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq             '.jobs[] | select(.name | endswith("(" + env.OS + ")")) | select(.name | startswith("pytest") | not) | "\(.conclusion // "offen") | \(.name)"' | tee jobs.txt
          [ "$(wc -l < jobs.txt)" -eq 2 ] || { echo "Erwartet: zwei Teiljobs für $OS"; exit 1; }
          if grep -v '^success' jobs.txt; then exit 1; fi
